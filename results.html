<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Form Results</title>
  <link rel="stylesheet" href="../style.css" />
</head>
<body class="results-body">

  <div class="container">
    <h1 class="results-title">Submitted User Information</h1>
    <dl id="resultsList"></dl>

    <a class="back-link" href="index.html">← Back to Form</a>
  </div>

  <script>
    function getParams() {
      const params = {};
      const searchParams = new URLSearchParams(window.location.search);
      for (const [key, value] of searchParams.entries()) {
        if (params[key]) {
          if (Array.isArray(params[key])) {
            params[key].push(value);
          } else {
            params[key] = [params[key], value];
          }
        } else {
          params[key] = value;
        }
      }
      return params;
    }

    function displayResults() {
      const params = getParams();
      const container = document.getElementById('resultsList');
      if (Object.keys(params).length === 0) {
        container.innerHTML = "<p>No data submitted.</p>";
        return;
      }

      const labels = {
        name: "Name",
        username: "User Name",
        email: "Email",
        password: "Password",
        age: "Age",
        birthday: "Birthday",
        phone: "Phone",
        season: "Favorite Season",
        favday: "Favorite Day",
        url: "Favorite Website",
        favcolor: "Favorite Color"
      };

      for (const key in params) {
        let val = params[key];
        if (Array.isArray(val)) {
          val = val.join(", ");
        }
        if (key === "favcolor") {
          val = `<span style="display:inline-block; width:25px; height:25px; background-color:${val}; border:1px solid #ccc; vertical-align: middle; margin-right: 8px;"></span>${val}`;
        }
        if (key === "password") {
          val = "••••••••";  // Hide password
        }

        const dt = document.createElement('dt');
        dt.textContent = labels[key] || key;
        const dd = document.createElement('dd');
        dd.innerHTML = val || "<em>Not provided</em>";

        container.appendChild(dt);
        container.appendChild(dd);
      }
    }

    displayResults();
  </script>

</body>
</html>
